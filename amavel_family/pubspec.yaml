name: amavel_family
description: AMAVEL Family Companion app for monitoring senior loved ones and exchanging voice messages.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.10.0
  cloud_firestore: ^4.13.0
  firebase_messaging: ^14.6.0
  firebase_storage: ^11.2.0

  # State Management
  flutter_riverpod: ^2.4.0

  # Audio
  just_audio: ^0.9.36
  record: ^5.1.0
  permission_handler: ^11.4.3

  # Utilities
  intl: ^0.19.0
  http: ^1.1.0
  uuid: ^4.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
