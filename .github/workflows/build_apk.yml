name: Build AMAVEL APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build AMAVEL APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amavel_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove old Android build files
        run: |
          rm -f android/build.gradle
          rm -f android/app/build.gradle
          rm -f android/settings.gradle

      - name: Generate fresh Android project
        run: flutter create --org com.amavel --project-name amavel_app --platforms android .

      - name: Create asset directories
        run: |
          mkdir -p assets/images assets/animations assets/sounds
          touch assets/images/.gitkeep assets/animations/.gitkeep assets/sounds/.gitkeep

      - name: Apply AMAVEL customizations
        run: |
          APP_BUILD=$(find android/app -name "build.gradle*" | head -1)
          echo "Found build file: $APP_BUILD"
          sed -i 's/minSdk.*/minSdk = 26/' "$APP_BUILD"

      - name: Fix AndroidManifest permissions
        run: |
          python3 << 'PYEOF'
          import os
          manifest = "android/app/src/main/AndroidManifest.xml"
          with open(manifest, "r") as f:
              content = f.read()
          permissions = """    <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>"""
          if "RECORD_AUDIO" not in content:
              content = content.replace("</manifest>", permissions + "\n</manifest>")
          with open(manifest, "w") as f:
              f.write(content)
          print("--- AndroidManifest.xml ---")
          print(content)
          PYEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --dart-define=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} --dart-define=ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} --dart-define=GOOGLE_CLOUD_KEY=${{ secrets.GOOGLE_CLOUD_KEY }} --dart-define=AZURE_SPEECH_KEY=${{ secrets.AZURE_SPEECH_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amavel-apk
          path: amavel_app/build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30
