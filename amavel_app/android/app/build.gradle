def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "com.amavel.app"
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.amavel.app"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Enable multidex
        multiDexEnabled true

        // Support for --dart-define
        def dartDefines = []
        if (project.hasProperty('dart-define')) {
            dartDefines = project.getProperty('dart-define').split(',')
        }

        dartDefines.forEach { define ->
            def pair = define.split('=')
            if (pair.length == 2) {
                buildConfigField("String", pair[0], "\"${pair[1]}\"")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug

            // Read signing config from environment variables for CI/CD
            if (System.getenv('CI') == 'true' || System.getenv('GITHUB_ACTIONS') == 'true') {
                if (System.getenv('KEYSTORE_PATH') && System.getenv('KEYSTORE_PASSWORD') &&
                    System.getenv('KEY_ALIAS') && System.getenv('KEY_PASSWORD')) {
                    signingConfig signingConfigs.release
                }
            }
        }
    }

    signingConfigs {
        debug {
            keyAlias keystoreProperties.get('keyAlias') ?: "androiddebugkey"
            keyPassword keystoreProperties.get('keyPassword') ?: "android"
            storeFile keystoreProperties.get('storeFile') ? file(keystoreProperties.get('storeFile')) : file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword keystoreProperties.get('storePassword') ?: "android"
        }

        release {
            keyAlias System.getenv('KEY_ALIAS') ?: keystoreProperties.get('keyAlias')
            keyPassword System.getenv('KEY_PASSWORD') ?: keystoreProperties.get('keyPassword')
            storeFile System.getenv('KEYSTORE_PATH') ? file(System.getenv('KEYSTORE_PATH')) : (keystoreProperties.get('storeFile') ? file(keystoreProperties.get('storeFile')) : null)
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: keystoreProperties.get('storePassword')
        }
    }

    lint {
        disable 'MissingDimensionality'
    }

    bundle {
        language.enableSplit = false
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
}

// Load keystoreProperties if available
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
