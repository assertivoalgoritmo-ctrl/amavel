# Flutter Gradle Build Configuration

# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4096m
org.gradle.parallel=true
org.gradle.workers.max=4

# Enable AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Enable desugaring for Java 8+ features on older Android versions
android.enableDesugaringForLocalVariables=true

# Flutter configuration
flutter.minLogLevel=info
flutter.buildMode=release

# Gradle plugin configuration
android.gradle.netrc.enabled=false

# Database configuration
android.database.sqlite.have_metadata=1

# Enable R8 compiler optimization (ProGuard replacement)
android.enableR8.fullMode=true

# Suppress specific warnings
android.suppressUnsupportedCompileSdk=34
